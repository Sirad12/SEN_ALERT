# pgAdmin (optionnel, comme dans docker-compose)
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
  namespace: senalert
spec:
  type: NodePort
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081          # http://localhost:30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: senalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef: { name: senalert-secret, key: PGADMIN_DEFAULT_EMAIL }
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef: { name: senalert-secret, key: PGADMIN_DEFAULT_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
