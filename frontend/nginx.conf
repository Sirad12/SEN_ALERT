server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Photos encodées en base64 : jusqu'à 5 Mo par image
    client_max_body_size 15m;

    # index.html ne doit jamais être mis en cache (les fichiers JS/CSS, eux, ont un hash)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API FastAPI (nom du service dans docker-compose.yml)
    location /api/ {
        proxy_pass http://backend-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Application Angular : toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
